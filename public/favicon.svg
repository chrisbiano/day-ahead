<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Favicon glyph: the arch mark simplified and enlarged for 16-32px tab
       rendering. The full brand mark (icon.svg-style scene) is mostly near-black
       at that size, so this variant fills the frame, thickens the stroke, and
       brightens the light. Lives on its own filename because Safari's favicon
       cache ignores query-string busting. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath>
    <radialGradient id="glow" cx="256" cy="396" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE3AE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F5C878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F5C878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="256" cy="396" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.5" stop-color="#FFF2D4"/>
      <stop offset="1" stop-color="#F0B95C"/>
    </radialGradient>
    <linearGradient id="arch" x1="256" y1="150" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9BE"/>
      <stop offset="0.55" stop-color="#F5C878"/>
      <stop offset="1" stop-color="#B98136"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#1B1712"/>
    <circle cx="256" cy="396" r="200" fill="url(#glow)"/>
    <path d="M170 396 A86 86 0 0 1 342 396 Z" fill="url(#orb)"/>
    <rect x="76" y="392" width="360" height="9" rx="4.5" fill="#F5C878" opacity="0.65"/>
    <path d="M136 396 L136 264 A120 120 0 0 1 376 264 L376 396"
          fill="none" stroke="url(#arch)" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
